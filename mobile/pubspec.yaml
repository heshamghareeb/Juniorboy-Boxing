name: junior_boy_boxing
description: "Junior Boy Boxing member application."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: 17.3.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  firebase_messaging: ^16.7.0
  firebase_storage: ^13.6.0
  firebase_app_check: ^0.4.8
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  firebase_performance: ^0.11.6
  flutter_stripe: ^14.1.0
  google_sign_in: ^6.3.0
  google_fonts: ^8.2.1
  hive_flutter: ^1.1.0
  cached_network_image: 3.4.1
  shimmer: 3.0.0
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  connectivity_plus: ^7.3.1
  uuid: ^4.6.0
  timezone: ^0.11.1
  flutter_local_notifications: ^22.3.1
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8


flutter:

  uses-material-design: true




  assets:
    - assets/icons/
    - assets/images/backgrounds/
    - assets/images/cards/
    - assets/images/photos/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.jpg"
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 24
